
spring:
  application:
    name: petzin

  datasource:
    url: '${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/petzin_webservice}'
    username: '${SPRING_DATASOURCE_USERNAME:postgres}'
    password: '${SPRING_DATASOURCE_PASSWORD:root}'
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: petzinpoll
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    operations-sorter: alpha
    tags-sorter: alpha